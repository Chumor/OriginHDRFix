name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "module/module.prop"

permissions:
  contents: read

concurrency:
  group: originhdrfix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOTES_FILE: /tmp/release-notes.md
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name workflow remote
        run: git remote rename origin dev

      - name: Read release version
        id: release
        run: |
          release_tag="$(sed -n 's/^version=//p' module/module.prop)"
          echo "release-tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Validate release source metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: |
          python3 scripts/validate_release_metadata.py --tag "$RELEASE_TAG"
          version_code="$(sed -n 's/^versionCode=//p' module/module.prop)"
          module_name="$(sed -n 's/^name=//p' module/module.prop)"
          asset_name="${module_name}-${RELEASE_TAG}-${version_code}.zip"
          {
            echo "asset-name=${asset_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --tag ${{ steps.release.outputs.release-tag }} --github-repo ${{ github.repository }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: ${{ env.NOTES_FILE }}

      - name: Prepare and validate release metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: |
          python3 scripts/prepare_release_metadata.py "$NOTES_FILE"
          python3 scripts/validate_release_metadata.py --tag "$RELEASE_TAG" --check-release

      - name: Check release metadata automation
        run: python3 scripts/test_release_metadata.py

      - name: Check installer behavior
        run: python3 scripts/test_customize.py

      - name: Build and precheck release module ZIP
        id: package
        uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        with:
          module-dir: module
          tag: ${{ steps.release.outputs.release-tag }}
          dry-run: true

      - name: Name release ZIP
        id: artifact
        env:
          SOURCE_ZIP: ${{ steps.package.outputs.zip-path }}
          ASSET_NAME: ${{ steps.metadata.outputs.asset-name }}
        run: |
          mkdir -p dist
          cp "$SOURCE_ZIP" "dist/${ASSET_NAME}"
          echo "zip-path=dist/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release tag and upload draft
        id: draft
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip-path }}
        run: |
          # Create a lightweight tag at the packaged source, never at the later sync commit.
          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${GITHUB_SHA}"
          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --draft --verify-tag --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file "$NOTES_FILE"
          gh release view "$RELEASE_TAG" --json databaseId --jq '"release-id=\(.databaseId)"' >> "$GITHUB_OUTPUT"

      - name: Verify draft and publish release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          ZIP_NAME: ${{ steps.metadata.outputs.asset-name }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.object.type !== 'commit' || ref.object.sha !== context.sha) {
              throw new Error('Release tag does not point to the packaged source commit');
            }
            const release_id = Number(process.env.RELEASE_ID);
            const { data: draft } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            if (!draft.draft || draft.tag_name !== tag || draft.target_commitish !== context.sha) {
              throw new Error('Expected a draft for the packaged source commit');
            }
            if (draft.body.trim() !== fs.readFileSync(process.env.NOTES_FILE, 'utf8').trim()) {
              throw new Error('Draft release notes differ from the generated changelog');
            }
            if (assets.length !== 1 || assets[0].name !== process.env.ZIP_NAME || assets[0].state !== 'uploaded') {
              throw new Error('Expected exactly one uploaded module ZIP with its original filename');
            }
            if (assets[0].digest !== `sha256:${process.env.ZIP_SHA256}`) {
              throw new Error('Uploaded ZIP digest differs from the validated package');
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id, draft: false,
              make_latest: 'true',
            });
            const { data: published } = await github.rest.repos.getRelease({ owner, repo, release_id });
            if (published.draft) {
              throw new Error('Release was not published; refusing to sync metadata');
            }

      - name: Commit release metadata to main
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/CHANGELOG.md update/update.json
          git commit -m "chore(release): sync version ${RELEASE_TAG} [skip ci]"
          gh auth setup-git
          git fetch dev main
          git rebase dev/main
          git push dev HEAD:main
